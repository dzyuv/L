x-common-env: &common-env
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USERNAME: ${MYSQL_APP_USER:-lab_app}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the environment}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in the environment}
  NACOS_ADDR: nacos:8848
  NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
  NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
  USER_SERVICE_URL: http://user-service:8081
  TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
  MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces

x-common-deps: &common-deps
  restart: unless-stopped
  depends_on:
    db-init:
      condition: service_completed_successfully
    nacos:
      condition: service_healthy

x-service-build: &service-build
  context: .
  dockerfile: deploy/Dockerfile.service

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the environment}
      MYSQL_DATABASE: lab_user
    ports: ["${MYSQL_HOST_PORT:-3307}:3306"]
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes: ["mysql_data:/var/lib/mysql"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nacos:
    image: nacos/nacos-server:v2.3.2
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "${NACOS_AUTH_ENABLE:-true}"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-bGFiLWJvb2tpbmctbmFjb3MtYXV0aC10b2tlbi1jaGFuZ2UtbWU=}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-change-me}
      JVM_XMS: 256m
      JVM_XMX: 256m
    ports: ["${NACOS_HTTP_PORT:-8858}:8848", "${NACOS_GRPC_PORT:-9858}:9848", "${NACOS_GRPC_TLS_PORT:-9859}:9849"]
    volumes: ["nacos_data:/home/nacos/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # One-shot job: creates the databases and the least-privilege application user.
  # Table creation and evolution are handled by Flyway when each service starts.
  db-init:
    image: mysql:8
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the environment}
      MYSQL_APP_USER: ${MYSQL_APP_USER:-lab_app}
      MYSQL_APP_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the environment}
    volumes:
      - ./database/init-databases.sh:/init-databases.sh:ro
    entrypoint: ["sh", "/init-databases.sh"]
    restart: "no"

  user-service:
    <<: *common-deps
    build:
      <<: *service-build
      args:
        SERVICE: user-service
        PORT: 8081
    image: lab/user-service:1.0.0
    environment:
      <<: *common-env
      SYSTEM_SERVICE_URL: http://system-service:8087

  resource-service:
    <<: *common-deps
    build:
      <<: *service-build
      args:
        SERVICE: resource-service
        PORT: 8082
    image: lab/resource-service:1.0.0
    environment:
      <<: *common-env
      BOOKING_SERVICE_URL: http://booking-service:8083

  booking-service:
    <<: *common-deps
    build:
      <<: *service-build
      args:
        SERVICE: booking-service
        PORT: 8083
    image: lab/booking-service:1.0.0
    environment:
      <<: *common-env
      SYSTEM_SERVICE_URL: http://system-service:8087
      RESOURCE_SERVICE_URL: http://resource-service:8082

  system-service:
    <<: *common-deps
    build:
      <<: *service-build
      args:
        SERVICE: system-service
        PORT: 8087
    image: lab/system-service:1.0.0
    environment:
      <<: *common-env

  gateway:
    <<: *common-deps
    depends_on:
      db-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      user-service:
        condition: service_healthy
      resource-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      system-service:
        condition: service_healthy
    build:
      <<: *service-build
      args:
        SERVICE: gateway
        PORT: 8080
    image: lab/gateway:1.0.0
    environment:
      NACOS_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
    ports: ["8080:8080"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: lab/frontend:1.0.0
    ports: ["5173:80"]
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4317:4317", "4318:4318"]
    restart: unless-stopped

volumes:
  mysql_data: {}
  nacos_data: {}
  prometheus_data: {}
  grafana_data: {}
