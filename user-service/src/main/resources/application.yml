server:
  port: 8081
spring:
  application.name: user-service
  config.import: optional:file:../.env[.properties],optional:file:.env[.properties],optional:nacos:user-service.yaml?group=LAB_BOOKING
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  cloud.nacos:
    discovery:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      group: LAB_BOOKING
      service: user-service
    config:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      group: LAB_BOOKING
      file-extension: yaml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/lab_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      update-strategy: always
  mapper-locations: classpath*:/mapper/**/*.xml
security:
  jwt-secret: ${JWT_SECRET}
  internal-token: ${INTERNAL_SERVICE_TOKEN}
  login:
    max-failures: ${LOGIN_MAX_FAILURES:5}
    lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  jwt:
    access-token-hours: ${JWT_ACCESS_TOKEN_HOURS:2}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:30}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    refresh-cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
  refresh-token:
    cleanup-retention-days: ${REFRESH_TOKEN_RETENTION_DAYS:7}
services:
  system:
    base-url: ${SYSTEM_SERVICE_URL:http://localhost:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  pattern:
    level: "%5p [%X{traceId:-},%X{spanId:-},%X{requestId:-}]"
