server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
spring:
  application.name: user-service
  config.import: optional:file:../.env[.properties],optional:file:.env[.properties],optional:nacos:user-service.yaml?group=LAB_BOOKING
  cloud.nacos:
    discovery:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      group: LAB_BOOKING
      service: user-service
    config:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      group: LAB_BOOKING
      file-extension: yaml
  datasource:
    url: jdbc:mysql://localhost:3306/lab_user?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      update-strategy: always
  mapper-locations: classpath*:/mapper/**/*.xml
security:
  jwt-secret: ${JWT_SECRET}
  internal-token: ${INTERNAL_SERVICE_TOKEN}
  login:
    max-failures: ${LOGIN_MAX_FAILURES:5}
  jwt:
    access-token-hours: ${JWT_ACCESS_TOKEN_HOURS:2}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:30}
