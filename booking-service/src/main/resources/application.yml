server:
  port: 8083
spring:
  application.name: booking-service
  task:
    scheduling:
      pool:
        size: 4
  config.import: optional:file:../.env[.properties],optional:file:.env[.properties],optional:nacos:booking-service.yaml?group=LAB_BOOKING
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  cloud.nacos:
    discovery:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      group: LAB_BOOKING
      service: booking-service
    config:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      group: LAB_BOOKING
      file-extension: yaml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/lab_booking?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      update-strategy: always
  mapper-locations: classpath*:/mapper/**/*.xml
security:
  jwt-secret: ${JWT_SECRET}
  internal-token: ${INTERNAL_SERVICE_TOKEN}
services:
  system:
    base-url: ${SYSTEM_SERVICE_URL:http://localhost:8087}
  resource:
    base-url: ${RESOURCE_SERVICE_URL:http://localhost:8082}
booking:
  checkin:
    before-minutes: ${BOOKING_CHECKIN_BEFORE_MINUTES:15}
    after-minutes: ${BOOKING_CHECKIN_AFTER_MINUTES:30}
  violation:
    max-count: ${BOOKING_VIOLATION_MAX_COUNT:3}
    window-days: ${BOOKING_VIOLATION_WINDOW_DAYS:30}
    restriction-days: ${BOOKING_VIOLATION_RESTRICTION_DAYS:30}
  fair-use:
    max-active: ${BOOKING_MAX_ACTIVE:5}
    teacher-max-active: ${BOOKING_TEACHER_MAX_ACTIVE:10}
    max-pending: ${BOOKING_MAX_PENDING:3}
    teacher-max-pending: ${BOOKING_TEACHER_MAX_PENDING:5}
    max-per-resource: ${BOOKING_MAX_PER_RESOURCE:2}
    teacher-max-per-resource: ${BOOKING_TEACHER_MAX_PER_RESOURCE:3}
    max-daily-minutes: ${BOOKING_MAX_DAILY_MINUTES:240}
    teacher-max-daily-minutes: ${BOOKING_TEACHER_MAX_DAILY_MINUTES:480}
    max-advance-days: ${BOOKING_MAX_ADVANCE_DAYS:30}
    pending-hold-hours: ${BOOKING_PENDING_HOLD_HOURS:24}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  pattern:
    level: "%5p [%X{traceId:-},%X{spanId:-},%X{requestId:-}]"

resilience4j:
  retry:
    retryAspectOrder: 1
    configs:
      default:
        maxAttempts: 2
        waitDuration: 200ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
  circuitbreaker:
    circuitBreakerAspectOrder: 2
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
