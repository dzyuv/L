server:
  port: 8082
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
spring:
  application.name: resource-service
  config.import: optional:file:../.env[.properties],optional:file:.env[.properties],optional:nacos:resource-service.yaml?group=LAB_BOOKING
  cloud.nacos:
    discovery:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      group: LAB_BOOKING
      service: resource-service
    config:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      group: LAB_BOOKING
      file-extension: yaml
  datasource:
    url: jdbc:mysql://localhost:3306/lab_resource?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      update-strategy: always
  mapper-locations: classpath*:/mapper/**/*.xml
security:
  jwt-secret: ${JWT_SECRET}
  internal-token: ${INTERNAL_SERVICE_TOKEN}
services:
  booking:
    base-url: http://localhost:8083
