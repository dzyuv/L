server:
  port: 8082
spring:
  application.name: resource-service
  config.import: optional:file:../.env[.properties],optional:file:.env[.properties],optional:nacos:resource-service.yaml?group=LAB_BOOKING
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  cloud.nacos:
    discovery:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      group: LAB_BOOKING
      service: resource-service
    config:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      group: LAB_BOOKING
      file-extension: yaml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/lab_resource?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      update-strategy: always
  mapper-locations: classpath*:/mapper/**/*.xml
security:
  jwt-secret: ${JWT_SECRET}
  internal-token: ${INTERNAL_SERVICE_TOKEN}
seed:
  demo-data: ${SEED_DEMO_DATA:false}
services:
  booking:
    base-url: ${BOOKING_SERVICE_URL:http://localhost:8083}
  user:
    base-url: ${USER_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  pattern:
    level: "%5p [%X{traceId:-},%X{spanId:-},%X{requestId:-}]"

resilience4j:
  retry:
    retryAspectOrder: 1
    configs:
      default:
        maxAttempts: 2
        waitDuration: 200ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
  circuitbreaker:
    circuitBreakerAspectOrder: 2
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
